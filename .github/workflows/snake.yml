# ════════════════════════════════════════════════════════════
#  Snake Contribution Animation — GitHub Actions Workflow
#  Runs every 12 hours and on every push to main/master.
#  Output SVGs are committed to the `output` branch and
#  referenced in README.md via raw.githubusercontent.com
# ════════════════════════════════════════════════════════════

name: Generate Snake Animation

on:
  schedule:
    # Runs at 00:00 and 12:00 UTC every day
    - cron: "0 0,12 * * *"
  workflow_dispatch:       # Allows manual trigger from GitHub UI
  push:
    branches:
      - master
      - main

jobs:
  generate:
    name: Generate Snake SVG
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake (Light + Dark themes)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
